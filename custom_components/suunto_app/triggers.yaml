.config_entry: &config_entry
  required: false
  selector:
    config_entry:
      integration: suunto_app

new_workout:
  fields:
    config_entry: *config_entry
    activity:
      required: false
      selector:
        select:
          multiple: true
          custom_value: true
          sort: true
          options:
            - Walking
            - Running
            - Trail running
            - Treadmill running
            - Cycling
            - Mountain biking
            - Indoor cycling
            - Hiking
            - Trekking
            - Nordic walking
            - Swimming
            - Gym
            - Strength training
            - Yoga
            - Cross-country skiing
            - Alpine skiing
            - Snowboarding
            - Paddling
            - Rowing
            - Kayaking
            - Climbing
    min_distance_km:
      required: false
      selector:
        number:
          min: 0
          max: 500
          step: 0.5
          unit_of_measurement: km
          mode: box
    min_duration_minutes:
      required: false
      selector:
        number:
          min: 0
          max: 1440
          step: 1
          unit_of_measurement: min
          mode: box
    commute:
      required: false
      default: any
      selector:
        select:
          translation_key: commute_filter
          options:
            - any
            - only
            - exclude
    with_achievement:
      required: false
      default: false
      selector:
        boolean:

woke_up:
  fields:
    config_entry: *config_entry
    sleep_below_hours:
      required: false
      selector:
        number:
          min: 0
          max: 16
          step: 0.25
          unit_of_measurement: h
          mode: box
    sleep_above_hours:
      required: false
      selector:
        number:
          min: 0
          max: 16
          step: 0.25
          unit_of_measurement: h
          mode: box
    readiness_below:
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: slider

ai_report:
  fields:
    config_entry: *config_entry
    report:
      required: false
      default: any
      selector:
        select:
          translation_key: ai_report_kind
          options:
            - any
            - daily
            - weekly
